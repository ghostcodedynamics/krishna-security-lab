services:
  mongodb:
    image: mongo:7
    container_name: ksl-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - ksl-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ksl-backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/krishna-security-lab
      JWT_ACCESS_SECRET: dev-access-secret-change-me-in-production-32chars
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me-in-production-32ch
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      - mongodb
    networks:
      - ksl-network
    restart: unless-stopped
    volumes:
      - ./backend/src:/app/src

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ksl-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      - backend
    networks:
      - ksl-network
    restart: unless-stopped
    volumes:
      - ./frontend/src:/app/src

  # --- Intentionally vulnerable labs (isolated; do not expose publicly) ---
  lab-auth:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./labs/auth:/app
    command: sh -c "npm install && npm start"
    ports:
      - "4001:4001"
    networks:
      - ksl-labs
    profiles:
      - labs

  lab-nosql:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./labs/nosql-injection:/app
    command: sh -c "npm install && npm start"
    ports:
      - "4002:4002"
    networks:
      - ksl-labs
    profiles:
      - labs

  lab-xss:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./labs/xss:/app
    command: sh -c "npm install && npm start"
    ports:
      - "4003:4003"
    networks:
      - ksl-labs
    profiles:
      - labs

  lab-idor:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./labs/idor:/app
    command: sh -c "npm install && npm start"
    ports:
      - "4004:4004"
    networks:
      - ksl-labs
    profiles:
      - labs

  lab-jwt:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./labs/jwt:/app
    command: sh -c "npm install && npm start"
    ports:
      - "4005:4005"
    networks:
      - ksl-labs
    profiles:
      - labs

  lab-api:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./labs/api-security:/app
    command: sh -c "npm install && npm start"
    ports:
      - "4006:4006"
    networks:
      - ksl-labs
    profiles:
      - labs

  lab-rbac:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./labs/rbac:/app
    command: sh -c "npm install && npm start"
    ports:
      - "4007:4007"
    networks:
      - ksl-labs
    profiles:
      - labs

networks:
  ksl-network:
    driver: bridge
  ksl-labs:
    driver: bridge

volumes:
  mongodb_data:
